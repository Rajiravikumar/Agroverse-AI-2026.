<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Farms - Agroverse AI</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f4f8f4;
    color: #17351f;
}

.header {
    background: linear-gradient(135deg, #087f3d, #20b45b);
    color: white;
    padding: 25px 20px;
    border-radius: 0 0 28px 28px;
}

.header h1 {
    margin: 0;
    font-size: 28px;
}

.header p {
    margin: 8px 0 0;
    opacity: 0.9;
}

.container {
    padding: 20px;
    max-width: 700px;
    margin: auto;
}

.add-button {
    width: 100%;
    border: none;
    background: #087f3d;
    color: white;
    padding: 16px;
    border-radius: 16px;
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 20px;
}

.farm-card {
    background: white;
    padding: 18px;
    border-radius: 20px;
    margin-bottom: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.farm-card h2 {
    margin: 0 0 12px;
    color: #087f3d;
}

.detail {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px solid #eee;
}

.detail:last-child {
    border-bottom: none;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.edit-btn,
.delete-btn {
    flex: 1;
    border: none;
    padding: 11px;
    border-radius: 12px;
    font-weight: bold;
}

.edit-btn {
    background: #e4f5e9;
    color: #087f3d;
}

.delete-btn {
    background: #ffe7e7;
    color: #c62828;
}

.empty {
    text-align: center;
    padding: 40px 20px;
    color: #777;
}

.form-box {
    display: none;
    background: white;
    padding: 20px;
    border-radius: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.form-box h2 {
    margin-top: 0;
    color: #087f3d;
}

input,
select {
    width: 100%;
    padding: 13px;
    margin: 7px 0 14px;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 16px;
}

.save-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 13px;
    background: #087f3d;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.cancel-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 13px;
    background: #eee;
    margin-top: 8px;
}
</style>
</head>

<body>

<div class="header">
    <h1>🌾 My Farms</h1>
    <p>Manage all your farms in one place</p>
</div>

<div class="container">

    <button class="add-button" onclick="showForm()">
        ➕ Add New Farm
    </button>

    <div class="form-box" id="farmForm">

        <h2 id="formTitle">🌱 Add New Farm</h2>

        <input id="farmName" placeholder="Farm name (Example: North Farm)">

        <select id="crop">
            <option value="">Select Crop</option>
            <option>Paddy</option>
            <option>Wheat</option>
            <option>Sugarcane</option>
            <option>Groundnut</option>
            <option>Maize</option>
            <option>Cotton</option>
            <option>Tomato</option>
            <option>Other</option>
        </select>

        <input id="area" type="number" placeholder="Farm area (acres)">

        <select id="soil">
            <option value="">Select Soil Type</option>
            <option>Clay Loam</option>
            <option>Red Soil</option>
            <option>Black Soil</option>
            <option>Alluvial Soil</option>
            <option>Sandy Soil</option>
            <option>Other</option>
        </select>

        <select id="stage">
            <option value="">Crop Stage</option>
            <option>Seedling</option>
            <option>Vegetative</option>
            <option>Flowering</option>
            <option>Fruiting</option>
            <option>Harvesting</option>
        </select>

        <input id="location" placeholder="Farm location">

        <button class="save-btn" onclick="saveFarm()">
            💾 Save Farm
        </button>

        <button class="cancel-btn" onclick="hideForm()">
            Cancel
        </button>

    </div>

    <div id="farmList"></div>

</div>

<script>

let farms = JSON.parse(localStorage.getItem("agroverseFarms")) || [];
let editingIndex = -1;

function showForm(index = -1) {

    editingIndex = index;

    document.getElementById("farmForm").style.display = "block";

    if (index >= 0) {

        let farm = farms[index];

        document.getElementById("formTitle").innerText = "✏️ Edit Farm";

        document.getElementById("farmName").value = farm.name;
        document.getElementById("crop").value = farm.crop;
        document.getElementById("area").value = farm.area;
        document.getElementById("soil").value = farm.soil;
        document.getElementById("stage").value = farm.stage;
        document.getElementById("location").value = farm.location;

    } else {

        document.getElementById("formTitle").innerText = "🌱 Add New Farm";

        clearForm();
    }
}

function hideForm() {

    document.getElementById("farmForm").style.display = "none";

    clearForm();

    editingIndex = -1;
}

function clearForm() {

    document.getElementById("farmName").value = "";
    document.getElementById("crop").value = "";
    document.getElementById("area").value = "";
    document.getElementById("soil").value = "";
    document.getElementById("stage").value = "";
    document.getElementById("location").value = "";
}

function saveFarm() {

    let name = document.getElementById("farmName").value.trim();
    let crop = document.getElementById("crop").value;
    let area = document.getElementById("area").value;
    let soil = document.getElementById("soil").value;
    let stage = document.getElementById("stage").value;
    let location = document.getElementById("location").value.trim();

    if (!name || !crop || !area || !soil || !stage || !location) {

        alert("Please fill all farm details.");

        return;
    }

    let farm = {
        name: name,
        crop: crop,
        area: area,
        soil: soil,
        stage: stage,
        location: location
    };

    if (editingIndex === -1) {

        farms.push(farm);

    } else {

        farms[editingIndex] = farm;
    }

    localStorage.setItem(
        "agroverseFarms",
        JSON.stringify(farms)
    );

    hideForm();

    displayFarms();
}

function displayFarms() {

    let list = document.getElementById("farmList");

    list.innerHTML = "";

    if (farms.length === 0) {

        list.innerHTML = `
            <div class="empty">
                <div style="font-size:50px;">🌱</div>
                <h3>No farms added yet</h3>
                <p>Add your first farm to start managing it with Agroverse AI.</p>
            </div>
        `;

        return;
    }

    farms.forEach((farm, index) => {

        list.innerHTML += `

            <div class="farm-card">

                <h2>🌾 ${farm.name}</h2>

                <div class="detail">
                    <span>🌱 Crop</span>
                    <strong>${farm.crop}</strong>
                </div>

                <div class="detail">
                    <span>📐 Area</span>
                    <strong>${farm.area} acres</strong>
                </div>

                <div class="detail">
                    <span>🪨 Soil</span>
                    <strong>${farm.soil}</strong>
                </div>

                <div class="detail">
                    <span>🌿 Crop Stage</span>
                    <strong>${farm.stage}</strong>
                </div>

                <div class="detail">
                    <span>📍 Location</span>
                    <strong>${farm.location}</strong>
                </div>

                <div class="actions">

                    <button class="edit-btn"
                        onclick="showForm(${index})">
                        ✏️ Edit
                    </button>

                    <button class="delete-btn"
                        onclick="deleteFarm(${index})">
                        🗑️ Delete
                    </button>

                </div>

            </div>
        `;
    });
}

function deleteFarm(index) {

    if (confirm("Delete this farm?")) {

        farms.splice(index, 1);

        localStorage.setItem(
            "agroverseFarms",
            JSON.stringify(farms)
        );

        displayFarms();
    }
}

displayFarms();

</script>

</body>
</html>
